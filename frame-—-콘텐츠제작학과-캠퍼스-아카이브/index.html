      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('camptime-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
